name: build-api

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/build-api.yml"
  workflow_dispatch:

concurrency:
  group: build-api-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/forcetower/lever

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the built sha tag into the deploy repo so the redeploy picks it up;
      # the commit doubles as a deploy log. Via the GraphQL createCommitOnBranch
      # API so the commit is signed by GitHub (Verified) and authored by the
      # token owner.
      - name: Pin image tag in deploy repo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_DEPLOY_PAT }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO: ForceTower/homelab-pi
          BRANCH: main
          FILES: services/lever/docker-compose.yml
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMELAB_DEPLOY_PAT not set; skipping image-tag pin."
            exit 0
          fi
          tag=$(printf '%s\n' "$TAGS" | grep -oE 'sha-[0-9a-f]+' | head -1)
          if [ -z "$tag" ]; then echo "::error::metadata produced no sha- tag"; exit 1; fi
          additions='[]'
          changed=0
          for file in $FILES; do
            if ! old=$(gh api "repos/${REPO}/contents/${file}?ref=${BRANCH}" --jq .content | base64 -d); then
              echo "::warning::${file} not found in ${REPO}; skipping."
              continue
            fi
            new=$(printf '%s' "$old" | sed "s|${IMAGE}:[^[:space:]]*|${IMAGE}:${tag}|g")
            if [ "$old" != "$new" ]; then changed=1; fi
            additions=$(jq -c --arg path "$file" --arg contents "$(printf '%s\n' "$new" | base64 -w0)" \
              '. + [{path: $path, contents: $contents}]' <<<"$additions")
          done
          if [ "$changed" -eq 0 ]; then
            echo "deploy composes already at ${tag}; nothing to commit."
            exit 0
          fi
          oid=$(gh api "repos/${REPO}/commits/${BRANCH}" --jq .sha)
          query='mutation($repo:String!,$branch:String!,$oid:GitObjectID!,$additions:[FileAddition!]!,$msg:String!){createCommitOnBranch(input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},message:{headline:$msg},expectedHeadOid:$oid,fileChanges:{additions:$additions}}){commit{oid}}}'
          jq -n --arg query "$query" --arg repo "$REPO" --arg branch "$BRANCH" --arg oid "$oid" \
            --arg msg "deploy(lever): ${tag}" --argjson additions "$additions" \
            '{query: $query, variables: {repo: $repo, branch: $branch, oid: $oid, msg: $msg, additions: $additions}}' \
            | gh api graphql --input - >/dev/null
          echo "Pinned $(jq length <<<"$additions") compose file(s) to ${tag} (Verified, via createCommitOnBranch)."

      # Trigger the Portainer redeploy webhook, retrying transient failures.
      # Skipped while the webhook secret is unset.
      - name: Trigger redeploy webhook
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "PORTAINER_WEBHOOK_URL not set; skipping redeploy."
            exit 0
          fi
          # Retry transient failures; fail fast on a 3xx (rejected token, not a
          # transient error). curl -f alone would treat a 3xx as success.
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK" \
              -H "CF-Access-Client-Id: $CF_ID" \
              -H "CF-Access-Client-Secret: $CF_SECRET" || echo 000)
            echo "attempt ${attempt}: webhook HTTP ${code}"
            case "$code" in
              2*) echo "Redeploy triggered."; exit 0 ;;
              30*) echo "::error::redirect (${code}) - deploy token rejected by the gateway."; exit 1 ;;
              *)  echo "transient (${code}); retrying in 15s..."; sleep 15 ;;
            esac
          done
          echo "::error::webhook failed after 5 attempts."
          exit 1
